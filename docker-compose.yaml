name: slidex-dev

services:
  # 🐘 BAZA DANYCH: PostgreSQL
  postgres-dev:
    image: postgres:16-alpine
    container_name: slidex-dev-postgres
    restart: always
    environment:
      POSTGRES_USER: slidex_user
      POSTGRES_PASSWORD: slidex_password
      POSTGRES_DB: slidex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - slidex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidex_user -d slidex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🟢 BACKEND: NestJS
  backend:
    build:
      context: ./slidex-backend
      dockerfile: Dockerfile
    container_name: slidex-dev-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://slidex_user:slidex_password@postgres-dev:5432/slidex_db?schema=public
    # DATABASE_URL jest pobierany przez prisma.config.ts. Brak --accept-data-loss
    # sprawia, że Prisma przerwie start zamiast zaakceptować destrukcyjną zmianę.
    command: sh -c "npx prisma db push && if [ -f dist/src/main.js ]; then exec node dist/src/main.js; else exec node dist/main.js; fi"
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - slidex-network

  # 🔵 FRONTEND: React (Vite) + Nginx
  frontend:
    build:
      context: ./slidex-frontend
      dockerfile: Dockerfile
    container_name: slidex-dev-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - slidex-network

volumes:
  postgres_data:

networks:
  slidex-network:
    driver: bridge
